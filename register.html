<!DOCTYPE html>
<html>
<head>
<title>MOSA Register</title>
</head>

<body>

<h1>MOSA Registration</h1>

<input
id="fullname"
placeholder="Full Name">

<br><br>

<input
id="email"
placeholder="Email">

<br><br>

<input
id="password"
type="password"
placeholder="Password">

<br><br>

<button onclick="registerUser()">

Register

</button>

<script>

async function registerUser(){

    const response =
    await fetch(

        "http://localhost:5000/register",

        {

            method:"POST",

            headers:{

                "Content-Type":
                "application/json"

            },

            body:JSON.stringify({

                fullName:

                document
                .getElementById(
                    "fullname"
                ).value,

                email:

                document
                .getElementById(
                    "email"
                ).value,

                password:

                document
                .getElementById(
                    "password"
                ).value

            })

        }

    );

    const data =
    await response.json();

    alert(
        data.message
    );

}

</script>

</body>
</html>
