<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOSA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{

background:
linear-gradient(
135deg,
#041b3a,
#0b4f8c
);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.container{

background:white;

width:100%;
max-width:500px;

padding:40px;

border-radius:20px;

box-shadow:
0 10px 25px
rgba(0,0,0,.2);

}

.logo{

font-size:50px;
font-weight:bold;
text-align:center;

color:#0b4f8c;

}

.subtitle{

text-align:center;

margin-bottom:30px;

color:#555;

}

input{

width:100%;

padding:15px;

margin:10px 0;

border:1px solid #ccc;

border-radius:10px;

}

button{

width:100%;

padding:15px;

border:none;

background:#0b4f8c;

color:white;

border-radius:10px;

cursor:pointer;

font-size:16px;

}

button:hover{

background:#083764;

}

.success{

color:green;

margin-top:20px;

font-weight:bold;

}

.error{

color:red;

margin-top:20px;

font-weight:bold;

}

.footer{

margin-top:25px;

text-align:center;

font-size:13px;

color:#777;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

MOSA

</div>

<div class="subtitle">

Medical Observation & Stroke Assistant

<br>

From Brain Signals to Life-Saving Insights

</div>

<input
type="text"
id="fullname"
placeholder="Full Name">

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="registerUser()">

Register

</button>

<div id="message"></div>

<div class="footer">

Founder & Project Lead

<br>

Mokoena Madia

</div>

</div>

<script>

const API_URL =
"https://madia-mokoena-1.onrender.com";

async function registerUser(){

const fullName =
document.getElementById(
"fullname"
).value;

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;

const message =
document.getElementById(
"message"
);

message.innerHTML =
"Registering...";

try{

const response =
await fetch(

API_URL + "/register",

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

fullName,
email,
password

})

}

);

const data =
await response.json();

message.className =
"success";

message.innerHTML =
data.message;

}
catch(error){

message.className =
"error";

message.innerHTML =

"Unable to connect to MOSA Server";

console.error(error);

}

}

</script>

</body>
</html>
